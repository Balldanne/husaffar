    LISTS_LOADED=false;IS_ADMIN=false;MEMBER=null;MEMBERS=null;S.screen="login";render();return;
  }
  var email=(user.email||"").toLowerCase();
  ME=email?email.split("@")[0]:"";
  var mref=db.ref("households/"+HOUSEHOLD_ID+"/members/"+user.uid);
  mref.once("value").then(function(snap){
    var m=snap.val();
    var isAdminEmail=ADMIN_EMAIL&&email===ADMIN_EMAIL.toLowerCase();
    if(!m){
      // Ny medlem: admin-mejlet auto-godkänns, övriga blir väntande
      m={email:email,approved:!!isAdminEmail,admin:!!isAdminEmail,ts:Date.now()};
      mref.set(m).catch(function(){});
    }else if(isAdminEmail&&(!m.admin||!m.approved)){
      m.admin=true;m.approved=true;mref.update({admin:true,approved:true}).catch(function(){});
    }
    MEMBER=m;IS_ADMIN=!!m.admin;
    if(m.approved){
      S.screen="app";
      if(IS_ADMIN)watchMembers();
      if(!dbRef)connect(HOUSEHOLD_ID);else render();
    }else{
      S.screen="pending";render();
    }
  }).catch(function(){
    // Regler blockerar (ej godkänd än) → visa väntläge
    MEMBER={email:email,approved:false};S.screen="pending";render();
  });
});

function watchMembers(){
  if(membersAllRef)return;
  membersAllRef=db.ref("households/"+HOUSEHOLD_ID+"/members");
  membersAllRef.on("value",function(snap){MEMBERS=snap.val()||{};if(S.tab==="dash")render()});
}
// Admin: godkänn/återkalla/ta bort medlem
function setMemberApproval(uid,approved){
  db.ref("households/"+HOUSEHOLD_ID+"/members/"+uid+"/approved").set(approved).catch(function(e){toast("Kunde inte: "+e.message)});
}
function removeMember(uid){
  db.ref("households/"+HOUSEHOLD_ID+"/members/"+uid).remove().catch(function(e){toast("Kunde inte: "+e.message)});
}
// Admin-panel som sheet
function openMembersPanel(){
  if(!IS_ADMIN||!MEMBERS){toast("Inga medlemmar att visa");return}
  var rows=Object.keys(MEMBERS).map(function(uid){var m=MEMBERS[uid];
    var status=m.admin?"👑 Admin":m.approved?"✓ Godkänd":"⏳ Väntar";
    var btns=m.admin?'':(m.approved?
      '<button class="mem-act" data-act="revoke" data-uid="'+uid+'" style="padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);font-size:11px;cursor:pointer">Återkalla</button>':
      '<button class="mem-act" data-act="approve" data-uid="'+uid+'" style="padding:6px 10px;border-radius:8px;border:none;background:#1a8a65;color:#fff;font-size:11px;cursor:pointer">Godkänn</button>')+
      (m.admin?'':'<button class="mem-act" data-act="remove" data-uid="'+uid+'" style="padding:6px 10px;border-radius:8px;border:1px solid #c83a3a;background:transparent;color:#c83a3a;font-size:11px;cursor:pointer;margin-left:6px">Ta bort</button>');
    return '<div style="display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--bg2);margin-bottom:7px"><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis">'+(m.email||uid)+'</div><div style="font-size:10px;color:var(--fg2)">'+status+'</div></div>'+btns+'</div>';
  }).join('');
  openInfoSheet("👥 Medlemmar","Godkänn vem som når familjens data",(rows||'<div style="color:var(--fg3);font-size:12px">Inga medlemmar än</div>')+
    '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)"><div style="font-size:11px;font-weight:600;margin-bottom:4px">🍽️ Receptbank</div><div style="font-size:10px;color:var(--fg2);margin-bottom:8px">'+(LISTS.recipes||[]).length+' rätter i banken. Synka för att lägga till saknade inbyggda rätter (behåller dina betyg).</div><button class="btn btn-s btn-sm" id="syncRecipes" style="width:100%">🔄 Synka receptbanken ('+DEFAULT_RECIPES.length+' inbyggda)</button></div>');
  setTimeout(function(){document.querySelectorAll(".mem-act").forEach(function(b){b.addEventListener("click",function(){
    var uid=b.dataset.uid,act=b.dataset.act;
    if(act==="approve"){setMemberApproval(uid,true);toast("✓ Godkänd")}
    else if(act==="revoke"){setMemberApproval(uid,false);toast("Åtkomst återkallad")}
    else if(act==="remove"){if(confirm("Ta bort medlemmen helt?")){removeMember(uid);toast("Borttagen")}}
    closeSheet();
  })});
    var sy=document.getElementById("syncRecipes");if(sy)sy.addEventListener("click",function(){
      var have={};(LISTS.recipes||[]).forEach(function(r){have[r.name.toLowerCase()]=true});
      var added=0;dc(DEFAULT_RECIPES).forEach(function(r){if(!have[r.name.toLowerCase()]){LISTS.recipes.push(r);added++}});
      listsSync();toast(added?("✓ "+added+" rätter tillagda ("+LISTS.recipes.length+" totalt)"):"Banken var redan komplett ("+LISTS.recipes.length+")");closeSheet();render();
    });
  },50);
}
// Väntläge-skärm
function rPending(el){
  el.innerHTML='<div class="login"><div style="font-size:48px;margin-bottom:8px">⏳</div><h2>Väntar på godkännande</h2><p style="font-size:13px;color:var(--fg2)">Ditt konto ('+((MEMBER&&MEMBER.email)||"")+') har registrerats men måste godkännas av familjens admin innan du får tillgång.</p><button class="btn btn-s" id="poLogout" style="margin-top:12px">Logga ut</button><button class="btn btn-s" id="poRefresh" style="margin-top:6px">Kontrollera igen</button></div>';
  document.getElementById("poLogout").addEventListener("click",function(){auth.signOut()});
  document.getElementById("poRefresh").addEventListener("click",function(){location.reload()});
}
fetchWeather();
</script>
