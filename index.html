// === CHARTS ===
// === EFFEKTNIVÅ-MODELL v3 (tvåkomponents-tidsskalor, mättnad, schablontider) ===
// Ordning: [Smak/Vitalitet, Känsla/Balans, Driv/Energi, Bas/Återhämtning]
// Varje parameter delas i SNABB komponent (lukt/cirkulation/vätska — timmar-dygn) och
// LÅNGSAM komponent (hormonbas/omega-3/tarmflora — veckor). Nivån = snabb + långsam.
// Decay uttrycks som halveringstid i TIMMAR → omräknas mot faktisk tid mellan måltider (schablon).
// Kalibrerat mot expertsammanställning (latenstider):
// Vitalitet: frukt/citrus tydligast 48-96h → långsammare snabb-komponent (36h) + tyngre slow.
// Energi/Driv: nitrat (rödbetor) 1,5-3h start/6-12h håll → snabb 8h; omega-3/zink dagar-veckor → slow.
var EFFECT_FAST=[ // snabb komponent: andel av intaget + halveringstid (h)
  {share:0.50,halfH:36},// Vitalitet: frukt/citrus bygger långsammare än antaget (doc: 48-96h tydligast)
  {share:0.55,halfH:18},// Balans: grönt/örter 12-48h
  {share:0.65,halfH:8},// Energi: nitrat-spår snabbt (rödbetor 1,5-3h, håller 6-12h)
  {share:0.50,halfH:14} // Återhämtning: vätska/elektrolyter snabbt
];
var EFFECT_SLOW=[ // långsam komponent: andel + halveringstid (h) ~ dagar-veckor
  {share:0.50,halfH:280},// Vitalitet: hudkvalitet/tarmflora ~12 dygn (doc: medelhavskost 2-4 v)
  {share:0.45,halfH:170},// Balans: ~7 dygn
  {share:0.35,halfH:140},// Energi: omega-3/zink-spår (lax, ostron, nötter: dagar-veckor)
  {share:0.50,halfH:200} // Återhämtning/hormonbas: ~8 dygn
];
// Mättnad: mjukt tak per komponent (diminishing returns). Tanh-liknande komprimering.
var EFFECT_SAT=[22,20,18,20];// nivå där komponenten börjar plana ut tydligt
function saturate(x,cap){if(x<=0)return x;return cap*Math.tanh(x/cap)}// mjukt tak, ~linjär för små x
// Schablontider per slot (timme på dygnet) — du matar inte in tid
var SLOT_HOUR={b:7,l:12.5,d:18};
// Mildare baslinje: ologgad måltid antas svagt under en normalkost-nivå (ej botten)
var EFFECT_BASELINE=[0.5,0.5,0.5,1.0];// svagt positiv "normalkost" — icke-loggning ser ej ut som katastrof
var EFFECT_REF=[38.7,31.7,26.2,29.3];// jämvikt vid bra kost — omkalibrerad efter expertlatenser
var TARGET_CURVE={
  mon:[0.90,0.93,0.82,1.03],tue:[0.90,0.92,0.83,1.01],wed:[0.94,0.95,0.97,0.96],
  thu:[0.98,0.96,0.88,0.93],fri:[1.01,1.00,1.02,0.90],sat:[1.00,1.03,1.06,0.89],sun:[0.95,1.01,0.95,0.99]
};
// Ackumulera med två komponenter + mättnad. mealStream = [{scores,absHour}] (absHour=timmar sedan start)
function accumulateMeals(mealStream){
  var fast=[0,0,0,0],slow=[0,0,0,0];var out=[];var prevH=null;
  mealStream.forEach(function(m){
    var dtH=prevH===null?0:Math.max(0,m.absHour-prevH);prevH=m.absHour;
    var row=[];
    for(var f=0;f<4;f++){
      // Decay båda komponenter mot faktisk tid sedan förra måltiden (schablontid)
      if(dtH>0){fast[f]*=Math.pow(0.5,dtH/EFFECT_FAST[f].halfH);slow[f]*=Math.pow(0.5,dtH/EFFECT_SLOW[f].halfH)}
      // Tillför intag, uppdelat på komponenter
      var v=m.scores[f]||0;
      fast[f]+=v*EFFECT_FAST[f].share;
      slow[f]+=v*EFFECT_SLOW[f].share;
      // Mättnad på summan
      var lvl=saturate(fast[f],EFFECT_SAT[f])+saturate(slow[f],EFFECT_SAT[f]);
      row.push(lvl);
    }
    out.push({absHour:m.absHour,levels:row.slice(),dayKey:m.dayKey,planned:m.planned});
  });
  return out;
}
// Bygg måltidsström 14 dagar × 3 slots, med schablontid (absHour). Loggat→faktisk, ologgat→baslinje.
function buildMealStream(){
  var now=new Date();now.setHours(0,0,0,0);
  var WKEY=["sun","mon","tue","wed","thu","fri","sat"];
  var stream=[];var dayMarks=[];
  for(var di=-7;di<=6;di++){
    var dt=new Date(now);dt.setDate(now.getDate()+di);dt.setHours(0,0,0,0);
    var dayStart=dt.getTime();var dk=WKEY[dt.getDay()];var isPast=di<=0;
    var baseHour=(di+7)*24;// timmar från fönstrets start
    var logged={};
    if(isPast){(HEALTH_LOG||[]).forEach(function(e){if(e.action!=="eaten"||!e.scores)return;var d=new Date(e.t);d.setHours(0,0,0,0);if(d.getTime()===dayStart){var slot=e.slot||"d";logged[slot]=logged[slot]||[0,0,0,0];for(var f=0;f<4;f++)logged[slot][f]+=e.scores[f]}})}
    var wp=LISTS.weekPlan&&LISTS.weekPlan[dk];var slots=typeof wp==="string"?{d:wp}:(wp||{});
    ["b","l","d"].forEach(function(sl){
      var sc;
      if(isPast){sc=logged[sl]?logged[sl]:EFFECT_BASELINE.slice()}
      else{var nm=slots[sl];var r=nm?(LISTS.recipes||[]).find(function(x){return x.name===nm}):null;sc=r?dietMealScore(r.items,r.cat).scores.slice():EFFECT_BASELINE.slice()}
      stream.push({scores:sc,absHour:baseHour+SLOT_HOUR[sl],dayKey:dk,planned:!isPast});
    });
    dayMarks.push({dayKey:dk,dayStart:dayStart,isPast:isPast,label:["Sön","Mån","Tis","Ons","Tor","Fre","Lör"][dt.getDay()],di:di});
  }
  return {stream:stream,dayMarks:dayMarks};
}

      if(!LISTS.recipes)LISTS.recipes=[];
      var byName={};LISTS.recipes.forEach(function(r){byName[r.name.toLowerCase()]=r});
      var added=0;
      dc(DEFAULT_RECIPES).forEach(function(r){
        var ex=byName[r.name.toLowerCase()];
        if(!ex){LISTS.recipes.push(r);byName[r.name.toLowerCase()]=r;added++;}
        else{// behåll betyg/ratings men uppdatera ev. saknade fält (items, howto, plock)
          if(ex.ratings===undefined&&r.ratings)ex.ratings=r.ratings;
          if(!ex.items||!ex.items.length)ex.items=r.items;
          if(!ex.howto)ex.howto=r.howto;
          if(r.plock&&!ex.plock)ex.plock=true;
        }
      });
      // Tvinga direkt skrivning (inte bara debounce) så det säkert landar i databasen
      _syncPending=false;if(_syncTimer){clearTimeout(_syncTimer);_syncTimer=null}
      _writingOwn=true;
      var r2=shopRef?shopRef.parent.child("lists"):null;
      if(r2)r2.set(LISTS,function(){_writingOwn=false;});else _writingOwn=false;
      toast(added?("✓ "+added+" rätter återställda ("+LISTS.recipes.length+" totalt)"):"Banken komplett ("+LISTS.recipes.length+" rätter)");
      closeSheet();render();
    });
  },50);
}
// Väntläge-skärm
function rPending(el){
  el.innerHTML='<div class="login"><div style="font-size:48px;margin-bottom:8px">⏳</div><h2>Väntar på godkännande</h2><p style="font-size:13px;color:var(--fg2)">Ditt konto ('+((MEMBER&&MEMBER.email)||"")+') har registrerats men måste godkännas av familjens admin innan du får tillgång.</p><button class="btn btn-s" id="poLogout" style="margin-top:12px">Logga ut</button><button class="btn btn-s" id="poRefresh" style="margin-top:6px">Kontrollera igen</button></div>';
  document.getElementById("poLogout").addEventListener("click",function(){auth.signOut()});
  document.getElementById("poRefresh").addEventListener("click",function(){location.reload()});
}
fetchWeather();
